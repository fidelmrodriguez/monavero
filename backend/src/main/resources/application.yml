spring:
  application:
    name: monavero-api
  datasource:
    url: ${MONAVERO_DB_JDBC_URL}
    username: ${MONAVERO_DB_USERNAME}
    password: ${MONAVERO_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
monavero:
  demo:
    enabled: ${MONAVERO_DEMO_ENABLED:true}
  cors:
    allowed-origins: ${MONAVERO_CORS_ALLOWED_ORIGINS:http://localhost:4200}
