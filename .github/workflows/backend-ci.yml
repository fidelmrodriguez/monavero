name: Backend Java CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Maven, PostgreSQL e testes de arquitetura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Conferir disponibilidade do Docker para Testcontainers
        run: docker info --format '{{.ServerVersion}}'
      - name: Compilar e executar testes de integração
        run: mvn -B -ntp clean verify
      - name: Guardar relatórios dos testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monavero-backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
