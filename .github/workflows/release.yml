name: Monavero 1.0 Release

on:
  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: read

jobs:
  frontend:
    name: Validar Angular para release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos e compilar a SPA
        run: |
          npm run typecheck
          npm run build
          test -f dist/monavero/browser/index.html
          test -f dist/monavero/browser/_redirects
          grep -Eq '^/api/monavero-readiness[[:space:]]' dist/monavero/browser/_redirects
          test ! -d dist/monavero/server
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Executar testes Angular
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test

  backend:
    name: Validar Java e PostgreSQL para release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verificar Docker para os testes integrados
        run: docker info --format '{{.ServerVersion}}'
      - name: Executar todos os testes
        run: mvn -B -ntp clean verify
      - name: Publicar relatórios em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monavero-release-backend-tests
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publicar GitHub Release 1.0.0
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar release somente após testes aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'Monavero 1.0.0' \
            --notes 'Primeira versão estável do projeto de portfólio Monavero. Banco digital exclusivamente demonstrativo: autenticação, contas, extrato, transferências e pagamentos fictícios, administração, notificações, cartões de simulação e perfil. Os workflows de frontend e backend desta tag foram aprovados. A validação do ambiente publicado é acompanhada separadamente.'
