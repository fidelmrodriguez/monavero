name: Frontend Angular CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Compilar Angular e SSR
        run: npm run build

      - name: Preparar Chrome Headless
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Executar testes de interface
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
